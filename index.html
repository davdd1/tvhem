<!doctype html>
<meta charset="utf-8">
<title>Hemma</title>
<body style="background:#000;color:#888;font:24px sans-serif">
<p id="m">Laddar hemskärmen…</p>
<script>
// The real page lives on the home RPi (HA /local), so the HA token never leaves the home network.
// It is written into this document instead of navigated to, so the page keeps TizenBrew's tizen.* APIs.
var SRC = "http://192.168.1.228:8123/local/tvhome/index.html";
function load(n) {
  fetch(SRC + "?t=" + Date.now()).then(function (r) { if (!r.ok) throw r.status; return r.text(); })
    .then(function (html) { document.open(); document.write(html); document.close(); })
    .catch(function () {
      document.getElementById("m").textContent = "Hittar inte Home Assistant (" + SRC + "), försöker igen…";
      setTimeout(function () { load(n + 1); }, Math.min(30000, 2000 * (n + 1)));
    });
}
load(0);
</script>
